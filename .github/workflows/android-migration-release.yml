name: Android legacy migration release

on:
  push:
    branches:
      - flutter-migration

concurrency:
  group: android-legacy-migration
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.8"
  MIGRATION_VERSION: "1.1.27"
  MIGRATION_BUILD_NUMBER: "38"
  MIGRATION_APK_SHA256: "f8ae5860438250da84e70bcf55e0b0a2f5d812891d3e22740a759c2fd53465e2"
  LEGACY_ANDROID_CERT_SHA256: "c6821dcc9ac2395eb9a810f1b9ff250a3a7186ab899fdd8de772d852cf542a72"

jobs:
  build-test-publish:
    if: contains(github.event.head_commit.message, '[publish-migration]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Validate migration version
        shell: bash
        run: |
          set -euo pipefail
          grep -q "^version: ${MIGRATION_VERSION}+${MIGRATION_BUILD_NUMBER}$" pubspec.yaml

      - name: Analyze and test
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test

      - name: Configure legacy Android signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64}" || -z "${KEYSTORE_PASSWORD}" || -z "${KEY_ALIAS}" || -z "${KEY_PASSWORD}" ]]; then
            echo "Legacy Android signing secrets are missing." >&2
            exit 1
          fi
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > android/upload-keystore.jks
          printf '%s\n' \
            'storeFile=../upload-keystore.jks' \
            "storePassword=${KEYSTORE_PASSWORD}" \
            "keyAlias=${KEY_ALIAS}" \
            "keyPassword=${KEY_PASSWORD}" \
            > android/key.properties

      - name: Build signed migration APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release \
            --build-name="${MIGRATION_VERSION}" \
            --build-number="${MIGRATION_BUILD_NUMBER}" \
            --dart-define="APP_VERSION=${MIGRATION_VERSION}" \
            --dart-define="UPDATE_REPOSITORY=${{ github.repository }}" \
            --dart-define="IOS_APP_STORE_ID=${{ vars.IOS_APP_STORE_ID }}"

      - name: Verify identity, version, and legacy certificate
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          build_tools="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "${build_tools}/apksigner" verify "${apk}"
          badging="$("${build_tools}/aapt" dump badging "${apk}" | head -n1)"
          echo "${badging}"
          grep -q "name='com.music.player'" <<<"${badging}"
          grep -q "versionCode='${MIGRATION_BUILD_NUMBER}'" <<<"${badging}"
          grep -q "versionName='${MIGRATION_VERSION}'" <<<"${badging}"

          actual_cert="$("${build_tools}/apksigner" verify --print-certs "${apk}" 2>&1 \
            | sed -nE 's/.*certificate SHA-256 digest:[[:space:]]*//Ip' \
            | head -n1 \
            | tr -d ':[:space:]' \
            | tr '[:upper:]' '[:lower:]')"
          [[ "${actual_cert}" == "${LEGACY_ANDROID_CERT_SHA256}" ]] || { echo "Migration APK is not signed by the legacy production certificate." >&2; exit 1; }

          mkdir -p dist
          cp "${apk}" "dist/DuckMusic-Flutter-v${MIGRATION_VERSION}-Android-universal.apk"
          curl -fsSL -o "${RUNNER_TEMP}/DuckMusic-v1.1.26-x86_64.apk" \
            "https://api.751152.xyz/updates/DuckMusic-v1.1.26-x86_64.apk"

      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prove in-place upgrade from production 1.1.26
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            set -eu
            adb install "${RUNNER_TEMP}/DuckMusic-v1.1.26-x86_64.apk"
            adb shell dumpsys package com.music.player | grep -q "versionName=1.1.26"
            adb install -r "dist/DuckMusic-Flutter-v${MIGRATION_VERSION}-Android-universal.apk"
            adb shell dumpsys package com.music.player | grep -q "versionName=${MIGRATION_VERSION}"

      - uses: actions/upload-artifact@v4
        with:
          name: android-legacy-migration-${{ env.MIGRATION_VERSION }}
          path: dist/*.apk

      - name: Create Flutter migration release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flutter-v${{ env.MIGRATION_VERSION }}
          target_commitish: ${{ github.sha }}
          name: DuckMusic Flutter v${{ env.MIGRATION_VERSION }}
          body: |
            Android legacy migration release.

            Existing DuckMusic 1.1.26 users can update in place through the app.
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/*.apk

      - name: Update legacy Android ECS channel
        shell: bash
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_SSH_PRIVATE_KEY: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
          ECS_UPDATE_DIR: ${{ secrets.ECS_UPDATE_DIR }}
          ECS_UPDATE_BASE_URL: ${{ secrets.ECS_UPDATE_BASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${ECS_HOST}" || -z "${ECS_USER}" || -z "${ECS_SSH_PRIVATE_KEY}" || -z "${ECS_UPDATE_DIR}" || -z "${ECS_UPDATE_BASE_URL}" ]]; then
            echo "ECS update secrets are missing." >&2
            exit 1
          fi

          apk_name="DuckMusic-Flutter-v${MIGRATION_VERSION}-Android-universal.apk"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${ECS_SSH_PRIVATE_KEY}" > ~/.ssh/duckmusic_ecs
          chmod 600 ~/.ssh/duckmusic_ecs
          if [[ -n "${ECS_KNOWN_HOSTS}" ]]; then
            printf '%s\n' "${ECS_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${ECS_PORT:-22}" -H "${ECS_HOST}" > ~/.ssh/known_hosts 2>/dev/null
          fi

          base_url="${ECS_UPDATE_BASE_URL%/}"
          manifest="${RUNNER_TEMP}/latest.json"
          cat > "${manifest}" <<EOF
          {
            "version": "${MIGRATION_VERSION}",
            "buildNumber": ${MIGRATION_BUILD_NUMBER},
            "downloadUrl": "${base_url}/${apk_name}",
            "downloads": {
              "arm64-v8a": "${base_url}/${apk_name}",
              "armeabi-v7a": "${base_url}/${apk_name}",
              "x86_64": "${base_url}/${apk_name}"
            },
            "description": "DuckMusic Flutter ${MIGRATION_VERSION}",
            "forceUpdate": false,
            "minBuildNumber": 0
          }
          EOF

          ssh -i ~/.ssh/duckmusic_ecs -p "${ECS_PORT:-22}" \
            "${ECS_USER}@${ECS_HOST}" "mkdir -p '${ECS_UPDATE_DIR}'"
          scp -i ~/.ssh/duckmusic_ecs -P "${ECS_PORT:-22}" \
            "dist/${apk_name}" "${manifest}" \
            "${ECS_USER}@${ECS_HOST}:${ECS_UPDATE_DIR}/"

  retry-ecs-publish:
    if: contains(github.event.head_commit.message, '[publish-ecs]')
    runs-on: ubuntu-latest
    env:
      ECS_SSH_PRIVATE_KEY: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
      ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
    steps:
      - name: Download and verify released migration APK
        shell: bash
        run: |
          set -euo pipefail
          apk_name="DuckMusic-Flutter-v${MIGRATION_VERSION}-Android-universal.apk"
          curl -fsSL --retry 5 --retry-all-errors \
            -o "${RUNNER_TEMP}/${apk_name}" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/flutter-v${MIGRATION_VERSION}/${apk_name}"
          echo "${MIGRATION_APK_SHA256}  ${RUNNER_TEMP}/${apk_name}" | sha256sum --check --strict

      - name: Publish verified migration to legacy ECS channel
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ECS_SSH_PRIVATE_KEY}" ]]; then
            echo "ECS_SSH_PRIVATE_KEY is missing." >&2
            exit 1
          fi

          host="api.751152.xyz"
          port="22"
          user="root"
          update_dir="/opt/website/updates"
          base_url="https://api.751152.xyz/updates"
          apk_name="DuckMusic-Flutter-v${MIGRATION_VERSION}-Android-universal.apk"
          apk="${RUNNER_TEMP}/${apk_name}"
          manifest="${RUNNER_TEMP}/latest.json"
          remote_apk="/tmp/${apk_name}.upload-${GITHUB_RUN_ID}"
          remote_manifest="/tmp/latest-${MIGRATION_VERSION}-${GITHUB_RUN_ID}.json"

          cat > "${manifest}" <<EOF
          {
            "version": "${MIGRATION_VERSION}",
            "buildNumber": ${MIGRATION_BUILD_NUMBER},
            "downloadUrl": "${base_url}/${apk_name}",
            "downloads": {
              "arm64-v8a": "${base_url}/${apk_name}",
              "armeabi-v7a": "${base_url}/${apk_name}",
              "x86_64": "${base_url}/${apk_name}"
            },
            "description": "DuckMusic Flutter ${MIGRATION_VERSION}",
            "forceUpdate": false,
            "minBuildNumber": 0
          }
          EOF

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${ECS_SSH_PRIVATE_KEY}" > ~/.ssh/duckmusic_ecs
          chmod 600 ~/.ssh/duckmusic_ecs
          if [[ -n "${ECS_KNOWN_HOSTS}" ]]; then
            printf '%s\n' "${ECS_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${port}" -H "${host}" > ~/.ssh/known_hosts 2>/dev/null
          fi

          scp -i ~/.ssh/duckmusic_ecs -P "${port}" \
            "${apk}" "${user}@${host}:${remote_apk}"
          scp -i ~/.ssh/duckmusic_ecs -P "${port}" \
            "${manifest}" "${user}@${host}:${remote_manifest}"

          apk_sha="$(sha256sum "${apk}" | cut -d' ' -f1)"
          manifest_sha="$(sha256sum "${manifest}" | cut -d' ' -f1)"
          remote_hashes="$(ssh -i ~/.ssh/duckmusic_ecs -p "${port}" "${user}@${host}" \
            "sha256sum '${remote_apk}' '${remote_manifest}'")"
          grep -q "^${apk_sha}  ${remote_apk}$" <<<"${remote_hashes}"
          grep -q "^${manifest_sha}  ${remote_manifest}$" <<<"${remote_hashes}"

          backup="${update_dir}/latest.json.bak_$(date -u +%Y%m%d_%H%M%S)"
          ssh -i ~/.ssh/duckmusic_ecs -p "${port}" "${user}@${host}" \
            "set -eu; test -d '${update_dir}'; if test -f '${update_dir}/latest.json'; then cp -p '${update_dir}/latest.json' '${backup}'; fi; chmod 0644 '${remote_apk}' '${remote_manifest}'; mv -f '${remote_apk}' '${update_dir}/${apk_name}'; mv -f '${remote_manifest}' '${update_dir}/latest.json'"

          curl -fsSL "${base_url}/latest.json" | jq -e \
            --arg version "${MIGRATION_VERSION}" \
            --arg url "${base_url}/${apk_name}" \
            '.version == $version and .downloadUrl == $url' >/dev/null
          curl -fsSL --retry 5 --retry-all-errors \
            -o "${RUNNER_TEMP}/public-${apk_name}" "${base_url}/${apk_name}"
          echo "${MIGRATION_APK_SHA256}  ${RUNNER_TEMP}/public-${apk_name}" | sha256sum --check --strict
