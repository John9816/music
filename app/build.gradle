import java.util.Properties

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }
}

// Secrets are read from local.properties (git-ignored) or environment variables (CI),
// never hardcoded in source. Falls back to empty string if unset so the build still runs.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream ->
        localProperties.load(stream)
    }
}
def resolveSecret = { String key, String defaultValue ->
    def value = localProperties.getProperty(key) ?: System.getenv(key)
    return value ?: defaultValue
}
def supabaseUrl = resolveSecret('SUPABASE_URL', 'https://api.751152.xyz')
def supabaseAnonKey = resolveSecret('SUPABASE_ANON_KEY', '')
// 聚合解析 apikey：local.properties �?VIDEO_PARSE_API_KEY，或环境变量同名
def videoParseApiKey = resolveSecret('VIDEO_PARSE_API_KEY', '')

android {
    namespace 'com.music.player'
    compileSdk 35

    defaultConfig {
        applicationId "com.music.player"
        minSdk 26
        targetSdk 35
        versionCode 36
        versionName "1.1.25"
        resConfigs "zh", "en"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "SUPABASE_URL", "\"${supabaseUrl}\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${supabaseAnonKey}\""
        buildConfigField "String", "VIDEO_PARSE_API_KEY", "\"${videoParseApiKey}\""
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
    lint {
        // androidx.lifecycle 2.9.x ships NullSafeMutableLiveDataDetector compiled against a
        // newer Kotlin analysis API than AGP 8.7.3 bundles; lint crashes with
        // IncompatibleClassChangeError. The check is only a nullability hint, so disable it
        // until AGP is upgraded (then remove this line and re-enable the check).
        disable "NullSafeMutableLiveData"
    }
    // Phone (arm64) + emulator (x86_64) + legacy 32-bit devices (v7a).
    // Media3 uses platform codecs (no libmpv), so the only bundled native lib is the tiny
    // datastore counter; per-ABI APKs stay small and every supported device gets a match.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk false
        }
    }
    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/*.kotlin_module'
            ]
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'

    // Retrofit for API calls
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'

    // ViewModel and LiveData
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.4'

    // ExoPlayer for audio playback (+ HLS for live radio m3u8)
    implementation 'androidx.media3:media3-exoplayer:1.6.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.6.1'
    implementation 'androidx.media3:media3-ui:1.6.1'
    // MediaSession: lock screen / bluetooth / headset media controls, system media panel
    implementation 'androidx.media3:media3-session:1.6.1'
    // TV live uses Media3 ExoPlayer (same stack as radio/HLS) — no libmpv/FFmpeg native bulk.

    // Glide for image loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.github.bumptech.glide:okhttp3-integration:4.16.0'

    // RecyclerView
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Gson for JSON
    implementation 'com.google.code.gson:gson:2.11.0'

    // DataStore for preferences
    implementation 'androidx.datastore:datastore-preferences:1.2.1'

    // Encrypted storage for auth tokens
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    testImplementation 'junit:junit:4.13.2'
    // Real org.json for JVM unit tests (Android stubs throw "not mocked")
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
