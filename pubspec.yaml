name: duck_music
description: 柒伍壹壹音乐 - 一套 Flutter 代码覆盖 iOS / Android / macOS / Windows 的跨平台音乐播放器。
publish_to: 'none'
version: 1.1.47+58

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.3.0
  flutter_cache_manager: ^3.4.2
  crypto: ^3.0.7
  file_selector: ^1.0.3
  image_picker: ^1.1.2
  audio_service: ^0.18.19
  audio_session: ^0.1.25
  flutter_acrylic: ^1.1.4
  http: ^1.1.0
  http_parser: ^4.1.2
  just_audio: ^0.9.36
  path_provider: ^2.1.0
  provider: ^6.0.5
  shared_preferences: ^2.2.0
  video_player: ^2.9.2
  url_launcher: ^6.2.0
  hotkey_manager: ^0.2.3
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_android_video: ^1.3.8
  media_kit_libs_ios_video: ^1.1.4
  media_kit_libs_macos_video: ^1.1.4
  media_kit_libs_windows_video: ^1.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon.png
