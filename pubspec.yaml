name: duck_music
description: 柒伍壹壹音乐 - 一套 Flutter 代码覆盖 iOS / Android / macOS / Windows 的跨平台音乐播放器。
publish_to: 'none'
version: 1.1.31+42

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.3.0
  audio_session: ^0.1.25
  flutter_acrylic: ^1.1.4
  http: ^1.1.0
  just_audio: ^0.9.36
  path_provider: ^2.1.0
  provider: ^6.0.5
  shared_preferences: ^2.2.0
  just_audio_background: ^0.0.1-beta.17
  url_launcher: ^6.2.0
  hotkey_manager: ^0.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon.png
